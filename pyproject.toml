[project]
name = "RenderMicroAPI"
version = "0.1.0"
description = "quick rundown on your render services"
readme = "README.md"
authors = [
    { name = "AranaDeDoros", email = "37278601+AranaDeDoros@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "fastapi==0.141.1",
    "h11==0.16.0",
    "idna==3.19",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "ruff==0.16.6",
    "starlette==1.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.7.0",
    "uvicorn==0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
